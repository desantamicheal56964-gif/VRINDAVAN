    <!-- Cleanly intercept and mock the Vite client HMR WebSocket when HMR is inactive -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          const OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            class MockViteWebSocket {
              constructor(url, protocols) {
                this.url = url;
                this.readyState = 3; // CLOSED stage
                this.onclose = null;
                this.onerror = null;
                this.onmessage = null;
                this.onopen = null;
                this._listeners = {};
                console.log("[SYSTEM] Suppressed container environment HMR WebSocket loop.");
              }
              addEventListener(type, callback) {
                if (!this._listeners[type]) this._listeners[type] = [];
                this._listeners[type].push(callback);
              }
              removeEventListener(type, callback) {
                if (this._listeners[type]) {
                  this._listeners[type] = this._listeners[type].filter(cb => cb !== callback);
                }
              }
              dispatchEvent(event) {
                return true;
              }
              send(data) {}
              close() {}
            }
            window.WebSocket = function(url, protocols) {
              const isViteHmr = Array.isArray(protocols) 
                ? protocols.includes('vite-hmr') 
                : (protocols === 'vite-hmr');
              if (isViteHmr) {
                return new MockViteWebSocket(url, protocols);
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            Object.setPrototypeOf(window.WebSocket, OriginalWebSocket);
          }
        }
      })();
    </script>
